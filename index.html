<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>This That &amp; Then Some</title>

  <!-- Favicon (populated dynamically from the logo flower via JS) -->
  <link rel="icon" id="favicon-link" type="image/svg+xml" href="data:,">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #fef7d2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }

    /* The flower only: the phrases of the full site are hidden */
    #flower-svg {
      display: block;
      width: min(86vw, 82svh, 640px);
      height: auto;
      aspect-ratio: 1 / 1;
    }
    #flower-svg text { display: none; }
  </style>
</head>
<body>
  <main>
    <svg id="flower-svg" xmlns="http://www.w3.org/2000/svg" data-viewbox="-10 -34.5 520 520" role="img" aria-label="An animated five-petal flower"></svg>
  </main>

  <!-- Source for the favicon (script.js draws the flower into it) -->
  <svg id="logo-flower-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" style="display:none" aria-hidden="true"></svg>

  <script src="script.js"></script>
</body>
</html>
